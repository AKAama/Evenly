<style>
  .icon-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:20px; margin-top:26px; }
  .icon-card { cursor:pointer; border:2px solid #dbe4ef; border-radius:8px; overflow:hidden; background:#fff; transition:.18s ease; }
  .icon-card:hover { transform:translateY(-2px); border-color:#80b9ff; }
  .icon-card.selected { border-color:#007aff; box-shadow:0 0 0 3px rgba(0,122,255,.13); }
  .preview { min-height:245px; display:grid; place-items:center; background:#f4f7fb; padding:24px 12px; }
  .app-icon { width:180px; height:180px; border-radius:38px; overflow:hidden; box-shadow:0 18px 34px rgba(13,67,130,.18); position:relative; flex:none; }
  .app-icon img { width:100%; height:100%; object-fit:cover; }
  .copy { padding:18px; color:#172033; }
  .copy h3 { margin:0 0 7px; font-size:18px; color:#172033; }
  .copy p { margin:0; color:#5d6878; line-height:1.55; font-size:14px; }
  .tag { display:inline-block; margin-top:13px; color:#0063cf; font-size:12px; font-weight:700; }
  .dual { background:#087df1; }
  .dual .halo { position:absolute; inset:20px; border:10px solid rgba(255,255,255,.13); border-radius:50%; }
  .dual .aa { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:0; color:white; font:700 82px/1 Georgia,serif; letter-spacing:-13px; transform:translateX(-5px); }
  .dual .aa span:last-child { transform:scaleX(-1); color:#cce5ff; }
  .dual .bar { position:absolute; left:43px; right:43px; top:88px; height:8px; border-radius:4px; background:#ffd166; }
  .equal { background:#58a5f5; }
  .equal::before,.equal::after { content:""; position:absolute; width:112px; height:32px; left:34px; border-radius:18px; background:#087df1; }
  .equal::before { top:49px; transform:rotate(-7deg); }
  .equal::after { top:99px; transform:rotate(7deg); }
  .equal .person { width:25px; height:25px; border-radius:50%; position:absolute; top:77px; z-index:2; box-shadow:0 0 0 7px rgba(255,255,255,.18); }
  .equal .p1 { left:31px; background:#fff; }
  .equal .p2 { right:31px; background:#ffd166; }
  .equal .mark { position:absolute; inset:0; display:grid; place-items:center; color:white; font:800 56px/1 system-ui; z-index:1; }
  .small-row { display:flex; align-items:center; justify-content:center; gap:12px; margin-top:18px; }
  .small { width:52px; height:52px; border-radius:12px; overflow:hidden; box-shadow:0 6px 14px rgba(24,53,87,.16); }
  .small img { width:100%; height:100%; }
  .small.dual .aa { font-size:24px; letter-spacing:-5px; transform:translateX(-2px); }
  .small.dual .bar { left:12px; right:12px; top:25px; height:3px; }
  .small.dual .halo { inset:6px; border-width:3px; }
  .small.equal::before,.small.equal::after { width:34px; height:9px; left:9px; }
  .small.equal::before { top:15px; }.small.equal::after { top:29px; }
  .small.equal .person { width:8px; height:8px; top:22px; box-shadow:none; }
  .small.equal .p1 { left:8px; }.small.equal .p2 { right:8px; }
  .small.equal .mark { font-size:17px; }
  @media(max-width:850px){ .icon-grid{grid-template-columns:1fr;} }
</style>

<h2>“AA 制”该怎样变成 Evenly 的符号？</h2>
<p class="subtitle">先看大图的性格，再看下方 52px 的主屏幕尺寸。点击选择最接近你想要的方向。</p>

<div class="icon-grid">
  <div class="icon-card" data-choice="a-signature" onclick="toggleSelect(this)">
    <div class="preview">
      <div>
        <div class="app-icon"><img src="current-icon.png" alt="Current handwritten A icon"></div>
        <div class="small-row"><div class="small"><img src="current-icon.png" alt="Small current icon"></div></div>
      </div>
    </div>
    <div class="copy">
      <h3>A. 手写 A</h3>
      <p>保留你现在的表达。亲切、有个人气质，但单个 A 对“AA 制”的暗示较弱，更像签名或姓名首字母。</p>
      <span class="tag">个性最强</span>
    </div>
  </div>

  <div class="icon-card" data-choice="b-balanced-aa" onclick="toggleSelect(this)">
    <div class="preview">
      <div>
        <div class="app-icon dual">
          <div class="halo"></div><div class="aa"><span>A</span><span>A</span></div><div class="bar"></div>
        </div>
        <div class="small-row"><div class="small dual"><div class="halo"></div><div class="aa"><span>A</span><span>A</span></div><div class="bar"></div></div></div>
      </div>
    </div>
    <div class="copy">
      <h3>B. 平衡双 A</h3>
      <p>两个相向的 A 组成一个稳定整体，中间横线代表“算平”。既保留 AA 的文化含义，也更容易成为独有标志。</p>
      <span class="tag">我的推荐</span>
    </div>
  </div>

  <div class="icon-card" data-choice="c-people-equal" onclick="toggleSelect(this)">
    <div class="preview">
      <div>
        <div class="app-icon equal"><span class="person p1"></span><span class="person p2"></span><span class="mark">=</span></div>
        <div class="small-row"><div class="small equal"><span class="person p1"></span><span class="person p2"></span><span class="mark">=</span></div></div>
      </div>
    </div>
    <div class="copy">
      <h3>C. 两个人，算平</h3>
      <p>用两个人和等号直接表达共同支出与公平结算。国际用户更容易理解，但“AA 制”的中文语境会变淡。</p>
      <span class="tag">含义最直观</span>
    </div>
  </div>
</div>
